[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamedoctor"
version = "0.1.0"
description = "通用游戏报错诊断与修复专家（Game Doctor）—— CLI 工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Game Doctor" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "tomli>=2; python_version < '3.11'",
    "keyring>=25",
    "psutil>=5.9",
]

[project.optional-dependencies]
vector = ["chromadb>=0.4"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
gamedoctor = "gamedoctor.cli:app"
gamedoctor-server = "gamedoctor.server:main"
gameAgent = "gamedoctor.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gamedoctor = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
